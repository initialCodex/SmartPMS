<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Add Treatment - Smart PMS</title>
</head>
<body>
    <div th:fragment="content">
        <!-- Header Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">Add Treatment Record</h1>
                    <p class="text-gray-600">Record new treatment for patients</p>
                </div>
                <div class="flex gap-2">
                    <a href="/doctor/patients" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                        View Records
                    </a>
                    <a href="/doctor/dashboard" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600">
                        Back to Dashboard
                    </a>
                </div>
            </div>
        </div>

        <!-- Success Message -->
        <div th:if="${success}" class="bg-green-50 border border-green-300 text-green-800 px-4 py-3 rounded mb-6">
            <strong>Success:</strong> <span th:text="${success}">Success message</span>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="bg-red-50 border border-red-300 text-red-800 px-4 py-3 rounded mb-6">
            <strong>Error:</strong> <span th:text="${error}">Error message</span>
        </div>

        <!-- Treatment Form -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <form method="post" action="/doctor/treatment/add" class="space-y-6">
                <!-- CSRF Token -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                
                <!-- Patient Selection -->
                <div>
                    <label for="patientId" class="block text-sm font-medium text-gray-700 mb-2">
                        Select Patient <span class="text-red-500">*</span>
                    </label>
                    <select id="patientId" name="patientId" required 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Choose a patient...</option>
                        <option th:each="patient : ${patients}" 
                                th:value="${patient.id}" 
                                th:text="${patient.firstName + ' ' + patient.lastName + ' (' + patient.email + ')'}">
                            Patient Name (email)
                        </option>
                    </select>
                </div>

                <!-- Diagnosis -->
                <div>
                    <label for="diagnosis" class="block text-sm font-medium text-gray-700 mb-2">
                        Diagnosis <span class="text-red-500">*</span>
                    </label>
                    <textarea id="diagnosis" name="diagnosis" rows="3" required
                              placeholder="Enter the patient's diagnosis..."
                              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>

                <!-- Treatment -->
                <div>
                    <label for="treatment" class="block text-sm font-medium text-gray-700 mb-2">
                        Treatment <span class="text-red-500">*</span>
                    </label>
                    <textarea id="treatment" name="treatment" rows="3" required
                              placeholder="Describe the treatment provided..."
                              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>

                <!-- Prescription -->
                <div>
                    <label for="prescription" class="block text-sm font-medium text-gray-700 mb-2">
                        Prescription <span class="text-red-500">*</span>
                    </label>
                    <textarea id="prescription" name="prescription" rows="3" required
                              placeholder="List medications, dosage, and instructions..."
                              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>

                <!-- Follow-up Date -->
                <div>
                    <label for="followUpDate" class="block text-sm font-medium text-gray-700 mb-2">
                        Follow-up Date (Optional)
                    </label>
                    <input type="datetime-local" id="followUpDate" name="followUpDate"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <!-- Notes -->
                <div>
                    <label for="notes" class="block text-sm font-medium text-gray-700 mb-2">
                        Additional Notes
                    </label>
                    <textarea id="notes" name="notes" rows="4"
                              placeholder="Any additional observations or notes..."
                              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>

                <!-- Doctor Info Display -->
                <div class="bg-blue-50 p-4 rounded-lg">
                    <h3 class="text-sm font-medium text-blue-800 mb-2">Treating Doctor</h3>
                    <p class="text-blue-700" th:text="${doctor != null ? 'Dr. ' + doctor.firstName + ' ' + doctor.lastName : 'Unknown'}">Dr. Name</p>
                    <p class="text-sm text-blue-600" th:text="${doctor != null ? doctor.specialization : ''}">Specialization</p>
                </div>

                <!-- Form Actions -->
                <div class="flex justify-end space-x-4 pt-6 border-t border-gray-200">
                    <a href="/doctor/dashboard" 
                       class="bg-gray-500 text-white px-6 py-2 rounded-lg hover:bg-gray-600 font-bold">
                        Cancel
                    </a>
                    <button type="submit" 
                            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded">
                        Add Treatment Record
                    </button>
                </div>
            </form>
        </div>

        <!-- Quick Access -->
        <div class="mt-6 flex flex-wrap gap-4">
            <a href="/doctor/patients" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                View Patient Records
            </a>
        </div>
    </div>

    <!-- JavaScript for enhanced UX -->
    <script>
        // Auto-filter appointments based on selected patient
        document.getElementById('patientId').addEventListener('change', function() {
            const selectedPatientId = this.value;
            const appointmentSelect = document.getElementById('appointmentId');
            const appointments = appointmentSelect.querySelectorAll('option');
            
            appointments.forEach(option => {
                if (option.value === '') {
                    option.style.display = 'block';
                    return;
                }
                
                // This is a simple approach - in a real app, you'd want to 
                // pass patient IDs with appointments to filter properly
                option.style.display = 'block';
            });
        });

        // Set minimum follow-up date to today
        const followUpInput = document.getElementById('followUpDate');
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        followUpInput.min = now.toISOString().slice(0, 16);
    </script>
</body>
</html>
